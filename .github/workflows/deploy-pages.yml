name: Deploy static demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "spa_recognition/frontend/**"
      - "game_model/**"
      - "ai/**"
      - "data/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: spa_recognition/frontend
        run: npm install

      - name: Build static (Pyodide) bundle
        working-directory: spa_recognition/frontend
        env:
          VITE_USE_PYODIDE: "true"
          VITE_BASE_PATH: /cryptid-bot/
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: spa_recognition/frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
